name: E2E

on:
  push:
    branches: [master]
  pull_request:

concurrency:
  group: e2e-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  e2e:
    name: e2e (binary + mock LAPI)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          # Track go.mod (Go 1.22) — the plugin's yaegi-bound floor. Keeps the
          # single source of truth and builds the mock on the supported version.
          go-version-file: go.mod
      # CI mock job: Traefik binary + mock LAPI (no Docker, no real Crowdsec).
      # Real-stack Pester lives in tests/e2e/real/ (`Test-Integration.ps1`).
      # `-k` keeps going after a failing mock scenario so the logs cover all of
      # them, while make still exits non-zero if any scenario failed.
      - name: Run mock scenarios
        run: make -k e2e_mock
      - name: Surface mock logs as annotations
        if: failure()
        run: |
          shopt -s nullglob
          logs=(/tmp/e2e-mock-*.log)
          if [ ${#logs[@]} -eq 0 ]; then
            echo "::error::mock e2e failed with no /tmp/e2e-mock-*.log"
            exit 0
          fi
          for f in "${logs[@]}"; do
            echo "::error::$(basename "$f"): $(tr '\n' ' ' < "$f" | head -c 1800)"
          done
      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-logs
          path: /tmp/e2e-mock-*.log
          if-no-files-found: ignore

  e2e-pester:
    name: e2e (docker + pester)
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
      - name: Install Pester
        shell: pwsh
        run: Install-Module -Name Pester -Force -Scope CurrentUser -SkipPublisherCheck
      # persist-credentials extraheader can 403 a public clone of traefik-geoblock.
      - name: Drop checkout extraheader for public clone
        run: git config --local --unset-all http.https://github.com/.extraheader || true
      - name: Run Pester real-stack tests
        shell: pwsh
        run: ./tests/e2e/real/Test-Integration.ps1 -HttpTimeoutSeconds 60 -SkipDockerCleanup
      - name: Show container logs on failure
        if: failure()
        run: |
          echo "=== docker ps -a ==="
          docker ps -a
          echo "=== crowdsec-test ==="
          docker logs crowdsec-test 2>/dev/null || true
          echo "=== traefik-test ==="
          docker logs traefik-test 2>/dev/null || true
      - name: Show Pester results XML
        if: always()
        run: |
          if [ -f tests/e2e/real/runner.log ]; then
            echo "=== runner.log ==="
            cat tests/e2e/real/runner.log
          fi
          if [ -f tests/e2e/real/test-results.xml ]; then
            cat tests/e2e/real/test-results.xml
            python3 - <<'PY'
import xml.etree.ElementTree as ET
from pathlib import Path
try:
    tree = ET.parse(Path("tests/e2e/real/test-results.xml"))
except Exception as exc:
    print(f"::error::test-results.xml parse failed: {exc}")
    raise SystemExit(0)
shown = 0
for case in list(tree.iter("test-case")) + list(tree.iter("testcase")):
    fail = case.find("failure")
    if fail is None:
        continue
    node = fail.find("message")
    msg = node.text if node is not None and node.text else fail.get("message") or fail.text or ""
    msg = " ".join(msg.split())[:400]
    name = case.get("name") or case.get("fullname") or "unknown"
    print(f"::error::{name} {msg}")
    shown += 1
    if shown >= 30:
        break
if shown == 0:
    print("::error::test-results.xml had no parsed failures")
PY
          else
            echo "no test-results.xml"
            echo "::error::no test-results.xml (Pester did not write results)"
          fi
      - name: Upload Pester results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pester-test-results
          path: |
            tests/e2e/real/test-results.xml
            tests/e2e/real/runner.log
          if-no-files-found: ignore
      - name: Stop test stack
        if: always()
        run: docker compose -f tests/e2e/real/docker-compose.test.yml down -v --remove-orphans

  e2e-go-redis:
    name: e2e (go + dragonfly)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Start Dragonfly
        run: docker compose -f tests/e2e/go/docker-compose.yml up -d
      - name: Run realredis Go tests
        run: go test -tags realredis -count=1 -v ./pkg/decisionstore
      - name: Show Dragonfly logs on failure
        if: failure()
        run: docker logs dragonfly-go-test 2>/dev/null || true
      - name: Stop Dragonfly
        if: always()
        run: docker compose -f tests/e2e/go/docker-compose.yml down -v --remove-orphans
