name: Main

permissions:
  contents: read

on:
  push:
    branches:
      - master
  pull_request:

jobs:

  main:
    name: Main Process
    runs-on: ubuntu-latest
    env:
      # Keep in sync with go.mod. Capped at 1.22 because the plugin is run by
      # yaegi (bundled in Traefik) and even Traefik v3.7.1 ships yaegi v0.16.1,
      # which only supports Go 1.22. Building on the floor makes go build / go
      # test reject newer stdlib before yaegi_test does.
      GO_VERSION: 1.22
      GOLANGCI_LINT_VERSION: v1.63.4
      # yaegi_test guard — pin to the version current Traefik bundles.
      YAEGI_VERSION: v0.16.1
      CGO_ENABLED: 0
    defaults:
      run:
        working-directory: ${{ github.workspace }}/go/src/github.com/david-garcia-garcia/crowdsec-bouncer-traefik-plugin

    steps:

      # https://github.com/marketplace/actions/setup-go-environment
      - name: Set up Go ${{ env.GO_VERSION }}
        uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}

      # https://github.com/marketplace/actions/checkout
      - name: Check out code
        uses: actions/checkout@v7
        with:
          path: go/src/github.com/david-garcia-garcia/crowdsec-bouncer-traefik-plugin
          fetch-depth: 0

      # https://github.com/marketplace/actions/cache
      - name: Cache Go modules
        uses: actions/cache@v6
        with:
          path: ${{ github.workspace }}/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-

      # https://golangci-lint.run/usage/install#other-ci
      - name: Install golangci-lint ${{ env.GOLANGCI_LINT_VERSION }}
        run: curl -sSfL https://raw.githubusercontent.com/golangci/golangci-lint/master/install.sh | sh -s -- -b $(go env GOPATH)/bin ${GOLANGCI_LINT_VERSION}

      - name: Install Yaegi ${{ env.YAEGI_VERSION }}
        run: curl -sfL https://raw.githubusercontent.com/traefik/yaegi/master/install.sh | bash -s -- -b $(go env GOPATH)/bin ${YAEGI_VERSION}

      - name: Setup GOPATH
        run: go env -w GOPATH=${{ github.workspace }}/go

      - name: Check and get dependencies
        run: |
          go mod tidy
          git diff --exit-code go.mod
          # git diff --exit-code go.sum
          go mod download
          # Keep committed vendor (ad-hoc reclaim Peek). go mod vendor restores
          # published utilities v1.0.6 which has no Peek. Re-enable with vendor
          # git-diff after upstream Peek: knowledge/debt/2026-09-20-upstream-reclaim-peek.md
          # go mod vendor
          # git diff --exit-code ./vendor/

      - name: Lint
        run: make lint

      - name: Tests
        run: make test

      - name: Run tests with Yaegi
        run: make yaegi_test
        env:
          GOPATH: ${{ github.workspace }}/go

  race:
    name: Race detector
    runs-on: ubuntu-latest
    env:
      GO_VERSION: 1.22
      CGO_ENABLED: 1
    defaults:
      run:
        working-directory: ${{ github.workspace }}/go/src/github.com/david-garcia-garcia/crowdsec-bouncer-traefik-plugin

    steps:

      - name: Set up Go ${{ env.GO_VERSION }}
        uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Check out code
        uses: actions/checkout@v7
        with:
          path: go/src/github.com/david-garcia-garcia/crowdsec-bouncer-traefik-plugin
          fetch-depth: 0

      - name: Cache Go modules
        uses: actions/cache@v6
        with:
          path: ${{ github.workspace }}/go/pkg/mod
          key: ${{ runner.os }}-go-race-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-race-
            ${{ runner.os }}-go-

      - name: Setup GOPATH
        run: go env -w GOPATH=${{ github.workspace }}/go

      - name: Race tests
        # Process-wide reclaim and instance tables are ResetForTest per package.
        # Parallel packages would race those registries; production has one process.
        run: |
          set -o pipefail
          go test -race -count=1 -p 1 ./pkg/... 2>&1 | tee /tmp/race.log
      - name: Surface race log
        if: failure()
        run: |
          if grep -q "DATA RACE" /tmp/race.log; then
            echo "::error::$(awk '/WARNING: DATA RACE/,/^==================$/' /tmp/race.log | tr '\n' ' ' | head -c 3500)"
          else
            echo "::error::$(grep -E 'FAIL\s+|panic:|--- FAIL' /tmp/race.log | tr '\n' ' ' | head -c 3500)"
          fi
