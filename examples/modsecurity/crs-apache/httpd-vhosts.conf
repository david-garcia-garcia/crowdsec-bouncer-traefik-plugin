# Inspect-only vhost for owasp/modsecurity-crs:4.3.0-apache-alpine-202406090906.
# Mounted over /usr/local/apache2/conf/extra/httpd-vhosts.conf.
#
# The image normally reverse-proxies to BACKEND. Here it never does: ModSecurity and CRS run
# their request phases (headers and body), then Apache answers HTTP 200 itself ("loopback").
# The plugin reads that status: 2xx allow, 3xx/4xx block, 5xx no verdict.
#
# Keep ${ENV} placeholders: Apache expands them from the image environment.

Mutex ${MUTEX}

# Client IP in the ModSecurity logs. Traefik sends the visitor's address in X-Real-IP; trust it
# only from the networks Traefik uses to reach this container (REMOTEIP_INT_PROXY, never 0.0.0.0/0).
# The pinned image hardcodes RemoteIPHeader X-Forwarded-For and ignores REMOTEIP_HEADER, so set it here.
RemoteIPHeader X-Real-IP
RemoteIPInternalProxy ${REMOTEIP_INT_PROXY}

RequestHeader set X-Forwarded-Proto "${REQ_HEADER_FORWARDED_PROTO}"
RequestHeader set X-Real-IP %{REMOTE_ADDR}s
RequestHeader set X-Unique-ID %{UNIQUE_ID}e

# Conditional and range headers would make Apache answer the tiny 200 with 304, 412, or 416,
# and the plugin treats any 3xx or 4xx as a block. Drop them before Apache evaluates them.
RequestHeader unset Range early
RequestHeader unset If-Range early
RequestHeader unset If-Modified-Since early
RequestHeader unset If-None-Match early

ServerName ${SERVER_NAME}
ServerAdmin ${SERVER_ADMIN}

SSLProxyEngine ${PROXY_SSL}
SSLProxyVerify ${PROXY_SSL_VERIFY}
SSLProxyCheckPeerName ${PROXY_SSL_CHECK_PEER_NAME}
SSLProxyCACertificateFile ${PROXY_SSL_CA_CERT}

UseCanonicalName on

# The loopback answer: after CRS allowed the request, return 200 with a two-byte body.
# No ProxyPass: Traefik sends the original request to your application, not this container.
<Location />
    RewriteEngine On
    RewriteRule .* - [R=200,L]
    ErrorDocument 200 "OK"
    ProxyPass !
</Location>

<VirtualHost *:${PORT}>
    RewriteEngine On
    RewriteCond %{REQUEST_URI} !^/\.well\-known/acme\-challenge/
    RewriteCond %{ENV:APACHE_ALWAYS_TLS_REDIRECT} on
    RewriteRule ^(.*)$ https://%{SERVER_NAME}:${SSL_PORT}$1 [L,R=301]
</VirtualHost>

<VirtualHost *:${SSL_PORT}>
  Protocols ${H2_PROTOCOLS}
  SSLEngine ${SSL_ENGINE}
  SSLCertificateFile ${SSL_CERT}
  SSLCertificateKeyFile ${SSL_CERT_KEY}
</VirtualHost>
