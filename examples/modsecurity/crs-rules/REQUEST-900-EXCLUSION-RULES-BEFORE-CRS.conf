# Your own rules, loaded before CRS. The image includes every *.conf in
# /etc/modsecurity.d/owasp-crs/rules/, so mounting this file there is enough.
# Use ids from 1000000 upwards for local rules.

# Reject a body on DELETE and OPTIONS. CRS already blocks a body on GET and HEAD
# (rules 920170 and 920171). The plugin sends the body with its Content-Length.
SecRule REQUEST_METHOD "@rx ^(?:DELETE|OPTIONS)$" \
    "id:1000100,phase:1,deny,status:400,log,msg:'Request body not allowed on this method',chain"
    SecRule REQUEST_HEADERS:Content-Length "!@rx ^0?$" "t:none"

# Exception: /api/search takes a GET with a JSON body (Elasticsearch style).
# Only rule 920170 is turned off, and only on that path.
SecRule REQUEST_URI "@beginsWith /api/search" \
    "id:1000200,phase:1,pass,nolog,ctl:ruleRemoveById=920170"
