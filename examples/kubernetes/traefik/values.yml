# The Traefik plugin catalog does not serve this fork, so Traefik loads it as a
# local plugin. An init container clones a release tag into an emptyDir, and
# the chart mounts it at plugins-local/src/<module>.
deployment:
  additionalVolumes:
    - name: bouncer-plugin
      emptyDir: {}
  initContainers:
    - name: fetch-bouncer-plugin
      image: alpine/git:v2.54.1
      args:
        - clone
        - --depth=1
        - --branch=v1.9.6
        - https://github.com/david-garcia-garcia/crowdsec-bouncer-traefik-plugin.git
        - /plugin
      env:
        - name: HOME
          value: /tmp
      volumeMounts:
        - name: bouncer-plugin
          mountPath: /plugin

experimental:
  localPlugins:
    bouncer:
      moduleName: github.com/david-garcia-garcia/crowdsec-bouncer-traefik-plugin
      mountPath: /plugins-local/src/github.com/david-garcia-garcia/crowdsec-bouncer-traefik-plugin
      type: localPath
      volumeName: bouncer-plugin

volumes:
  - name: crowdsec-bouncer-key
    mountPath: /etc/traefik/crowdsec
    type: secret

log:
  level: INFO

accessLog:
  enabled: true
  format: json
  fields:
    headers:
      defaultMode: drop
      names:
        User-Agent: keep

ingressRoute:
  dashboard:
    enabled: true

service:
  spec:
    externalTrafficPolicy: Local
