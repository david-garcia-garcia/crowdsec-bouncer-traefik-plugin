apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: bouncer
  namespace: traefik
spec:
  plugin:
    bouncer:
      bouncerEnabled: true
      logLevel: INFO
      lapiEnabled: true
      lapiMode: stream
      lapiScheme: http
      lapiHost: crowdsec-service.crowdsec.svc.cluster.local:8080
      lapiKeyFile: /etc/traefik/crowdsec/BOUNCER_KEY_traefik
      appsecEnabled: true
      appsecHost: crowdsec-appsec-service.crowdsec.svc.cluster.local:7422
      appsecKeyFile: /etc/traefik/crowdsec/BOUNCER_KEY_traefik
