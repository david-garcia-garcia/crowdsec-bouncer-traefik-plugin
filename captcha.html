<!DOCTYPE html>
<html lang="en">

<head>
  <title>{{ .Domain }}</title>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <script src="{{ .FrontendJS }}" async defer></script>
  <style>
    html,
    body {
      height: 100%;
      margin: 0;
      background: #fff;
      color: #1c1c1c;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      display: flex;
      align-items: center;
      justify-content: center;
    }

    main {
      width: min(420px, calc(100% - 48px));
    }

    .brand {
      font-size: 22px;
      font-weight: 650;
      letter-spacing: -0.03em;
    }

    h1 {
      margin: 16px 0 22px;
      font-size: 16px;
      font-weight: 400;
      line-height: 1.4;
    }

    .widget {
      display: inline-block;
      min-width: 300px;
      min-height: 74px;
      padding: 8px 12px;
      border: 1px solid #e0e0e0;
      border-radius: 4px;
      background: #fafafa;
      box-shadow: 0 1px 2px rgba(0, 0, 0, 0.04);
    }

    .note {
      margin: 28px 0 0;
      color: #666;
      font-size: 14px;
      line-height: 1.5;
    }

    a {
      color: inherit;
    }
  </style>
</head>

<body>
  <main>
    <div class="brand">{{ .Domain }}</div>
    <h1>Verify you are human</h1>
    <form id="captcha-form" action="" method="POST">
      {{ if .DrawCheckbox }}
      <div class="widget">
        <div id="captcha" class="{{ .FrontendKey }}" data-sitekey="{{ .SiteKey }}" data-callback="captchaCallback" data-action="{{ .Action }}"></div>
      </div>
      {{ else }}
      <input type="hidden" name="g-recaptcha-response" id="g-recaptcha-response">
      {{ end }}
    </form>
    <p class="note"><em>{{ .Domain }}</em> needs to review the security of your connection before you continue.</p>
  </main>
  <script>{{ .BootScript }}</script>
  <script>
    function captchaCallback() {
      setTimeout(function () { document.querySelector("#captcha-form").submit(); }, 500);
    }
  </script>
</body>

</html>
