http:
  routers:
    r:
      rule: "PathPrefix(`/foo`)"
      entryPoints:
        - web
      service: backend
      middlewares:
        - bouncer
  services:
    backend:
      loadBalancer:
        servers:
          - url: "@@BACKEND_URL@@"
  middlewares:
    bouncer:
      plugin:
        bouncer:
          # custom + mocklapi /siteverify: always-pass JSON, no real bot check.
          bouncerCaptchaCustomJsUrl: "http://@@LAPI_HOST@@/dummy.js"
          bouncerCaptchaCustomKey: dummy-captcha
          bouncerCaptchaCustomResponse: dummy-captcha-response
          bouncerCaptchaCustomValidateUrl: "http://@@LAPI_HOST@@/siteverify"
          bouncerCaptchaFilePath: "@@SCENARIO_DIR@@/captcha.html"
          bouncerCaptchaGateBindIp: true
          bouncerCaptchaGateSecret: "e2e-mock-captcha-gate-secret"
          bouncerCaptchaGracePeriodSeconds: "10"
          bouncerCaptchaProvider: custom
          bouncerCaptchaSecretKey: "e2e-dummy-secret"
          bouncerCaptchaSiteKey: "e2e-dummy-site"
          bouncerEnabled: "true"
          bouncerForwardedHeadersTrustedIps:
            - "127.0.0.1/32"
          captchaEnabled: true
          lapiEnabled: "true"
          lapiHost: "@@LAPI_HOST@@"
          lapiKey: "@@APIKEY@@"
          lapiMode: stream
          lapiScheme: http
          lapiUpdateIntervalSeconds: "2"
          logLevel: DEBUG
