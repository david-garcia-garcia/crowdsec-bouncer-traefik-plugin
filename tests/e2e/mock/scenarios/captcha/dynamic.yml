http:
  routers:
    r:
      rule: "PathPrefix(`/foo`)"
      entryPoints:
        - web
      service: backend
      middlewares:
        - bouncer
  services:
    backend:
      loadBalancer:
        servers:
          - url: "@@BACKEND_URL@@"
  middlewares:
    bouncer:
      plugin:
        bouncer:
          # custom + mocklapi /siteverify: always-pass JSON, no real bot check.
          captchaCustomJsUrl: "http://@@LAPI_HOST@@/dummy.js"
          captchaCustomKey: dummy-captcha
          captchaCustomResponse: dummy-captcha-response
          captchaCustomValidateUrl: "http://@@LAPI_HOST@@/siteverify"
          captchaFilePath: "@@SCENARIO_DIR@@/captcha.html"
          captchaGateBindIp: true
          captchaGateSecret: "e2e-mock-captcha-gate-secret"
          captchaGracePeriodSeconds: "10"
          captchaProvider: custom
          captchaSecretKey: "e2e-dummy-secret"
          captchaSiteKey: "e2e-dummy-site"
          bouncerEnabled: "true"
          bouncerForwardedHeadersTrustedIps:
            - "127.0.0.1/32"
          captchaEnabled: true
          lapiEnabled: "true"
          lapiHost: "@@LAPI_HOST@@"
          lapiKey: "@@APIKEY@@"
          lapiMode: stream
          lapiScheme: http
          lapiUpdateIntervalSeconds: "2"
          logLevel: DEBUG
