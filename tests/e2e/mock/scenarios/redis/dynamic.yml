http:
  routers:
    r:
      rule: "PathPrefix(`/foo`)"
      entryPoints:
        - web
      service: backend
      middlewares:
        - bouncer
  services:
    backend:
      loadBalancer:
        servers:
          - url: "@@BACKEND_URL@@"
  middlewares:
    bouncer:
      plugin:
        bouncer:
          bouncerEnabled: "true"
          lapiMode: live
          lapiScheme: http
          lapiHost: "@@LAPI_HOST@@"
          lapiKey: "@@APIKEY@@"
          lapiRedisEnabled: "true"
          lapiRedisHost: "@@REDIS_HOST@@"
          lapiRedisReadHosts:
            - "@@REDIS_READ_HOST@@"
          bouncerForwardedTrustedIps:
            - "127.0.0.1/32"
