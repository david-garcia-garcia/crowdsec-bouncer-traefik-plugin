http:
  routers:
    r:
      rule: "PathPrefix(`/foo`)"
      entryPoints:
        - web
      service: backend
      middlewares:
        - bouncer
  services:
    backend:
      loadBalancer:
        servers:
          - url: "@@BACKEND_URL@@"
  middlewares:
    bouncer:
      plugin:
        bouncer:
          bouncerEnabled: "true"
          lapiMode: stream
          lapiUpdateIntervalSeconds: "2"
          lapiScheme: http
          lapiHost: "@@LAPI_HOST@@"
          lapiKey: "@@APIKEY@@"
          bouncerForwardedTrustedIps:
            - "127.0.0.1/32"
          lapiScopeHeaders:
            Country: CF-IPCountry
            AS: CF-ASN
            username: X-User
