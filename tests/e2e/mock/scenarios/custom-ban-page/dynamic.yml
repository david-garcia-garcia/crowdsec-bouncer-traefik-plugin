http:
  routers:
    r:
      rule: "PathPrefix(`/foo`)"
      entryPoints:
        - web
      service: backend
      middlewares:
        - bouncer
  services:
    backend:
      loadBalancer:
        servers:
          - url: "@@BACKEND_URL@@"
  middlewares:
    bouncer:
      plugin:
        bouncer:
          bouncerBanFilePath: "@@SCENARIO_DIR@@/ban.json"
          bouncerEnabled: "true"
          bouncerForwardedHeadersTrustedIps:
            - "127.0.0.1/32"
          bouncerRemediationHeadersCustomName: "X-E2E-Remediation"
          bouncerTraceHeadersCustomName: x-trace
          lapiEnabled: "true"
          lapiHost: "@@LAPI_HOST@@"
          lapiKey: "@@APIKEY@@"
          lapiMode: stream
          lapiScheme: http
          lapiUpdateIntervalSeconds: "2"
