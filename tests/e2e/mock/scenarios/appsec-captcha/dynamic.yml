http:
  routers:
    r:
      rule: "PathPrefix(`/foo`)"
      entryPoints:
        - web
      service: backend
      middlewares:
        - bouncer
  services:
    backend:
      loadBalancer:
        servers:
          - url: "@@BACKEND_URL@@"
  middlewares:
    bouncer:
      plugin:
        bouncer:
          appsecEnabled: "true"
          appsecHost: "@@APPSEC_HOST@@"
          appsecScheme: http
          bouncerAppsecFailureAction: ban
          bouncerEnabled: "true"
          bouncerForwardedHeadersTrustedIps:
            - "127.0.0.1/32"
          bouncerRemediationHeadersCustomName: X-Remediation
          # custom + mocklapi /siteverify: always-pass JSON, no real bot check.
          captchaCustomJsUrl: "http://@@LAPI_HOST@@/dummy.js"
          captchaCustomKey: dummy-captcha
          captchaCustomResponse: dummy-captcha-response
          captchaCustomValidateUrl: "http://@@LAPI_HOST@@/siteverify"
          captchaEnabled: true
          captchaFilePath: "@@SCENARIO_DIR@@/captcha.html"
          captchaGateBindIp: true
          captchaGateSecret: "e2e-mock-captcha-gate-secret"
          captchaGracePeriodSeconds: "10"
          captchaProvider: custom
          captchaSecretKey: "e2e-dummy-secret"
          captchaSiteKey: "e2e-dummy-site"
          # IP bouncing disabled — the captcha here comes from AppSec only.
          lapiEnabled: "false"
          lapiHost: "@@LAPI_HOST@@"
          lapiKey: "@@APIKEY@@"
          lapiScheme: http
          logLevel: DEBUG
