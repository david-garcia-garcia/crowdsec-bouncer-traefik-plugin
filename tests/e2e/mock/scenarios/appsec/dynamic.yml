http:
  routers:
    r:
      rule: "PathPrefix(`/foo`)"
      entryPoints:
        - web
      service: backend
      middlewares:
        - bouncer
  services:
    backend:
      loadBalancer:
        servers:
          - url: "@@BACKEND_URL@@"
  middlewares:
    bouncer:
      plugin:
        bouncer:
          appsecBodyLimit: 4
          appsecEnabled: "true"
          appsecHost: "@@APPSEC_HOST@@"
          appsecScheme: http
          bouncerAppsecFailureAction: ban
          bouncerEnabled: "true"
          bouncerForwardedHeadersTrustedIps:
            - "127.0.0.1/32"
          # IP bouncing disabled — this scenario exercises AppSec only.
          lapiEnabled: "false"
          lapiHost: "@@LAPI_HOST@@"
          lapiKey: "@@APIKEY@@"
          lapiScheme: http
