# File provider: nested plugin maps (bouncerDecisionScopeHeaders, geoblock databaseSources)
# do not decode reliably as Docker labels. Chain geo-enrich then the bouncer so
# Country matching uses a looked-up header, not a client-set test header.
http:
  middlewares:
    geo-enrich:
      plugin:
        geoblock:
          mode: enrich
          countryHeader: X-IPCountry
          allowPrivate: true
          logLevel: DEBUG
          ipHeaderStrategy: CheckFirstNonePrivate
          ipHeaders:
            - x-forwarded-for
          requestHeaderEnrich:
            X-IPCountry: country
          databaseSources:
            default_ip2location:
              enabled: false
            seed:
              path: /plugins-local/src/github.com/david-garcia-garcia/traefik-geoblock/seeds/IP2LOCATION-LITE-DB1.IPV6.BIN
              databaseType: bin
              fieldsPreconfigured: ip2location_lite
    bouncer-scope-none:
      plugin:
        bouncer:
          appsecHttpTimeoutSeconds: "60"
          bouncerDecisionScopeHeaders:
            Country: X-IPCountry
            AS: CF-ASN
            username: X-User
          bouncerEnabled: "true"
          bouncerForwardedHeadersCustomName: X-Forwarded-For
          bouncerForwardedHeadersTrustedIps:
            - "172.16.0.0/12"
            - "127.0.0.1/32"
          lapiEnabled: "true"
          lapiHost: crowdsec:8080
          lapiHttpTimeoutSeconds: "60"
          lapiKey: "c51a1c7000000000000000000000000b"
          lapiMode: none
          logFormat: json
          logLevel: DEBUG
          reclaimGraceSeconds: "2"
    bouncer-scope-stream:
      plugin:
        bouncer:
          appsecHttpTimeoutSeconds: "60"
          bouncerDecisionScopeHeaders:
            Country: X-IPCountry
            AS: CF-ASN
            username: X-User
          bouncerEnabled: "true"
          bouncerForwardedHeadersCustomName: X-Forwarded-For
          bouncerForwardedHeadersTrustedIps:
            - "172.16.0.0/12"
            - "127.0.0.1/32"
          bouncerStartupBlock: "false"
          lapiEnabled: "true"
          lapiHost: crowdsec:8080
          lapiHttpTimeoutSeconds: "60"
          lapiKey: "a1b2c3d4e5f60718293a4b5c6d7e8f90"
          lapiMode: stream
          lapiStreamScopes:
            - country
            - as
            - username
          lapiUpdateIntervalSeconds: "5"
          logFormat: json
          logLevel: DEBUG
          reclaimGraceSeconds: "2"
    bouncer-header-none:
      plugin:
        bouncer:
          appsecHttpTimeoutSeconds: "60"
          bouncerDecisionScopeHeaders:
            Country: CF-IPCountry
            AS: CF-ASN
            username: X-User
          bouncerEnabled: "true"
          bouncerForwardedHeadersCustomName: X-Forwarded-For
          bouncerForwardedHeadersTrustedIps:
            - "172.16.0.0/12"
            - "127.0.0.1/32"
          lapiEnabled: "true"
          lapiHost: crowdsec:8080
          lapiHttpTimeoutSeconds: "60"
          lapiKey: "c51a1c7000000000000000000000000c"
          lapiMode: none
          logFormat: json
          logLevel: DEBUG
          reclaimGraceSeconds: "2"
    chain-scope-none:
      chain:
        middlewares:
          - geo-enrich
          - bouncer-scope-none
    chain-scope-stream:
      chain:
        middlewares:
          - geo-enrich
          - bouncer-scope-stream
