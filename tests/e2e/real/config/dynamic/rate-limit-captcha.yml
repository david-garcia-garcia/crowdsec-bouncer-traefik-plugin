# Captcha buckets on real Traefik (rate_limit_captcha.Tests.ps1), against the stack's Dragonfly.
# rl-captcha-owner publishes the policy under instance name rl-captcha: a captcha bucket per-ip-soft
# (2 per hour) listed before a ratelimit bucket per-ip-hard (5 per hour) on the same key, so the
# ratelimit bucket wins in that list order too. It does not bounce.
# /rl-captcha/ subscribes to that policy and serves its own custom-provider test captcha (dummy-captcha,
# the stack's form posts the challenge marker). Its bypassCaptcha rule covers /rl-captcha/api/.
# /rl-captcha-nocaptcha/ subscribes to the same policy without a captcha, so its captcha bucket answers
# as ratelimit; it logs at TRACE so each "crowdsec bouncer bound" line can be paired with the bind ERROR.
http:
  routers:
    rl-captcha-owner:
      rule: PathPrefix(`/rl-captcha-owner/`)
      entryPoints: [web]
      middlewares: [rl-captcha-owner]
      service: whoami@docker
    rl-captcha:
      rule: PathPrefix(`/rl-captcha/`)
      entryPoints: [web]
      middlewares: [rl-captcha]
      service: whoami@docker
    rl-captcha-nocaptcha:
      rule: PathPrefix(`/rl-captcha-nocaptcha/`)
      entryPoints: [web]
      middlewares: [rl-captcha-nocaptcha]
      service: whoami@docker
  middlewares:
    rl-captcha-owner:
      plugin:
        bouncer:
          bouncerEnabled: "false"
          logFormat: json
          logLevel: DEBUG
          rateLimitBuckets:
            - name: per-ip-soft
              requests: "2"
              window: 1h
              action: captcha
              key:
                - from: ip
            - name: per-ip-hard
              requests: "5"
              window: 1h
              key:
                - from: ip
          rateLimitEnabled: "true"
          rateLimitInstanceName: rl-captcha
          rateLimitRedisHost: dragonfly:6379
          rateLimitSyncRate: "0"
          reclaimGraceSeconds: "2"
    rl-captcha:
      plugin:
        bouncer:
          bouncerActionRules:
            - name: api-no-captcha
              path: ^/rl-captcha/api/
              action:
                - bypassCaptcha
          bouncerEnabled: "true"
          bouncerForwardedHeadersCustomName: X-Forwarded-For
          bouncerForwardedHeadersTrustedIps:
            - "172.28.0.1/32"
          bouncerRemediationHeadersCustomName: X-Crowdsec-Remediation
          captchaCustomJsUrl: http://widget.example/rl-captcha/widget.js
          captchaCustomKey: dummy-captcha
          captchaCustomResponse: dummy-captcha-response
          captchaCustomValidateUrl: http://dummy-captcha/siteverify
          captchaEnabled: "true"
          captchaFilePath: /e2e-captcha.html
          captchaGateBindIp: "true"
          captchaGateSecret: test-gate-secret
          captchaProvider: custom
          captchaSecretKey: e2e-dummy-secret
          captchaSiteKey: e2e-dummy-site
          logFormat: json
          logLevel: DEBUG
          rateLimitInstanceName: rl-captcha
          reclaimGraceSeconds: "2"
    rl-captcha-nocaptcha:
      plugin:
        bouncer:
          bouncerEnabled: "true"
          bouncerForwardedHeadersCustomName: X-Forwarded-For
          bouncerForwardedHeadersTrustedIps:
            - "172.28.0.1/32"
          bouncerRemediationHeadersCustomName: X-Crowdsec-Remediation
          logFormat: json
          logLevel: TRACE
          rateLimitInstanceName: rl-captcha
          reclaimGraceSeconds: "2"
