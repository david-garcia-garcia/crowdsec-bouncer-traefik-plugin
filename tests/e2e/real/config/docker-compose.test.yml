  dragonfly:
    image: docker.dragonflydb.io/dragonflydb/dragonfly:v1.40.2
    container_name: "dragonfly-test"
    restart: unless-stopped
    ulimits:
      memlock: -1
    labels:
      - "traefik.enable=false"

  crowdsec:
    image: crowdsecurity/crowdsec:v1.8.0
    container_name: "crowdsec-test"
    restart: unless-stopped
    environment:
      # Minimal collections for testing
      COLLECTIONS: "crowdsecurity/traefik crowdsecurity/appsec-crs-inband crowdsecurity/appsec-bot-challenge"
      CUSTOM_HOSTNAME: "crowdsec-test"
      # Fixture keys. Exclusive DecisionStore New allows one Traefik name per
      # SessionHex (mode + LAPI URL + key). Reuse 40796d93 only where mode or
      # host already differs (/whoami none, /stream stream, /live live,
      # /lapi-fail-ban none on crowdsec:9, /waf-only appsec). Sibling names
      # on the same SessionHex get their own BOUNCER_KEY_*.
      BOUNCER_KEY_TRAEFIK_TEST: "40796d93c2958f9e58345514e67740e5"
      BOUNCER_KEY_TRAEFIK_SCOPES: "a1b2c3d4e5f60718293a4b5c6d7e8f90"
      BOUNCER_KEY_STRICT: "c51a1c70000000000000000000000001"
      BOUNCER_KEY_CAPTCHA: "c51a1c70000000000000000000000002"
      BOUNCER_KEY_REMEDIATION_HEADERS: "c51a1c70000000000000000000000003"
      BOUNCER_KEY_CUSTOM_BAN: "c51a1c70000000000000000000000004"
      BOUNCER_KEY_APPSEC: "c51a1c70000000000000000000000005"
      BOUNCER_KEY_WAF_FAIL_BAN: "c51a1c70000000000000000000000006"
      BOUNCER_KEY_WAF_FAIL_PASS: "c51a1c70000000000000000000000007"
      BOUNCER_KEY_STATUS_429: "c51a1c70000000000000000000000008"
      BOUNCER_KEY_SHORT_CAPTCHA: "c51a1c70000000000000000000000009"
      BOUNCER_KEY_BOT: "c51a1c7000000000000000000000000a"
      BOUNCER_KEY_SCOPE_NONE: "c51a1c7000000000000000000000000b"
      BOUNCER_KEY_HEADER_NONE: "c51a1c7000000000000000000000000c"
      BOUNCER_KEY_TRUSTED: "c51a1c7000000000000000000000000d"
      BOUNCER_KEY_REDIS_CACHE: "c51a1c7000000000000000000000000e"
      BOUNCER_KEY_REDIS_CACHE_HOLD: "c51a1c7000000000000000000000000f"
      BOUNCER_KEY_DISABLED: "c51a1c70000000000000000000000010"
      BOUNCER_KEY_LAPI_FAIL_PASS: "c51a1c70000000000000000000000011"
      BOUNCER_KEY_SEV_OWNER: "c51a1c70000000000000000000000012"
      BOUNCER_KEY_SEV_B: "c51a1c70000000000000000000000013"
      BOUNCER_KEY_HCAPTCHA: "c51a1c70000000000000000000000014"
      BOUNCER_KEY_RECAPTCHA: "c51a1c70000000000000000000000015"
      BOUNCER_KEY_TURNSTILE: "c51a1c70000000000000000000000016"
      BOUNCER_KEY_EUCAPTCHA: "c51a1c70000000000000000000000017"
      BOUNCER_KEY_ENTERPRISE: "c51a1c70000000000000000000000018"
      BOUNCER_KEY_ENTERPRISE_SCORE: "c51a1c70000000000000000000000019"
      # Disable aggressive collections that cause 150k decision issue
      DISABLE_COLLECTIONS: "crowdsecurity/iptables crowdsecurity/linux crowdsecurity/sshd"
      # Enable debugging
      PARSERS: "crowdsecurity/syslog-logs crowdsecurity/dateparse-enrich"
      # Minimal setup for testing
      DISABLE_AGENT: "false"
      DISABLE_ONLINE_API: "true"
      CROWDSEC_BYPASS_DB_VOLUME_CHECK: "true"
      # Test mode settings
      LEVEL_DEBUG: "true"
      # Use persistent volumes to cache downloaded databases
    volumes:
      - "crowdsec-db-test:/var/lib/crowdsec/data/"
      - "crowdsec-config-test:/etc/crowdsec/"
      - "./acquis.yaml:/etc/crowdsec/acquis.yaml:ro"
      - "./acquis.d:/etc/crowdsec/acquis.d:ro"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.crowdsec-challenge.rule=PathPrefix(`/crowdsec-internal/challenge`)"
      - "traefik.http.routers.crowdsec-challenge.entrypoints=web"
      - "traefik.http.routers.crowdsec-challenge.middlewares=bouncer-bot@docker"
      - "traefik.http.routers.crowdsec-challenge.service=crowdsec-challenge"
      - "traefik.http.services.crowdsec-challenge.loadbalancer.server.port=7423"
    healthcheck:
      test: ["CMD", "cscli", "version"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s
    ports:
      # Expose LAPI for testing
      - "8081:8080"



volumes:
  crowdsec-db-test:
  crowdsec-config-test:
  traefik-logs:

networks:
  default:
    name: crowdsec-test-network
    ipam:
      config:
        - subnet: 172.28.0.0/16
          gateway: 172.28.0.1
