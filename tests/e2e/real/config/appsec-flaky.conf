# AppSec proxy the backoff lifecycle test stops and starts (docker stop/start
# appsec-flaky-test) to simulate an AppSec outage without touching crowdsec.
# Forwards everything, X-Crowdsec-Appsec-* headers and body included, to the CRS listener.
#
# Resolve crowdsec per request through Docker DNS: a literal proxy_pass host is resolved once at
# nginx start, and crowdsec can restart during stack boot and come back on another IP (seen in CI:
# the cached IP then belonged to traefik and every AppSec call was refused).
server {
    listen 80;
    resolver 127.0.0.11 valid=5s ipv6=off;
    set $appsec_listener http://crowdsec:7422;
    location / {
        proxy_pass $appsec_listener;
    }
}
