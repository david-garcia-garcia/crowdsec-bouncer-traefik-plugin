# LAPI proxy the live backoff test stops and starts (docker stop/start lapi-flaky-test) to
# simulate a LAPI outage without touching crowdsec, which every other suite uses.
# Forwards every request, X-Api-Key included, to LAPI.
#
# Resolve crowdsec per request through Docker DNS: a literal proxy_pass host is resolved once at
# nginx start, and crowdsec can restart during stack boot and come back on another IP.
server {
    listen 80;
    resolver 127.0.0.11 valid=5s ipv6=off;
    set $lapi http://crowdsec:8080;
    location / {
        proxy_pass $lapi;
    }
}
