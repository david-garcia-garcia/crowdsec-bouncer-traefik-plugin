# Always-pass captcha siteverify for real-stack e2e. Not a bot check.
server {
    listen 80;
    location /siteverify {
        default_type application/json;
        return 200 '{"success":true}';
    }
    location /dummy.js {
        default_type application/javascript;
        return 200 '// e2e dummy captcha';
    }
}
