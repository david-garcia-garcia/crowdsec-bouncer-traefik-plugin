# File provider: nested plugin maps (lapiScopeHeaders, geoblock databaseSources)
# do not decode reliably as Docker labels. Chain geo-enrich then the bouncer so
# Country matching uses a looked-up header, not a client-set test header.
http:
  middlewares:
    geo-enrich:
      plugin:
        geoblock:
          mode: enrich
          countryHeader: X-IPCountry
          allowPrivate: true
          logLevel: DEBUG
          ipHeaderStrategy: CheckFirstNonePrivate
          ipHeaders:
            - x-forwarded-for
          requestHeaderEnrich:
            X-IPCountry: country
          databaseSources:
            default_ip2location:
              bouncerEnabled: false
            seed:
              path: /plugins-local/src/github.com/david-garcia-garcia/traefik-geoblock/seeds/IP2LOCATION-LITE-DB1.IPV6.BIN
              databaseType: bin
              fieldsPreconfigured: ip2location_lite
    bouncer-scope-none:
      plugin:
        bouncer:
          bouncerEnabled: "true"
          lapiKey: "c51a1c7000000000000000000000000b"
          lapiHost: crowdsec:8080
          httpTimeoutSeconds: "60"
          logLevel: DEBUG
          lapiMode: none
          lapiScopeHeaders:
            Country: X-IPCountry
            AS: CF-ASN
            username: X-User
          bouncerForwardedTrustedIps:
            - "172.16.0.0/12"
            - "127.0.0.1/32"
          bouncerForwardedHeader: X-Forwarded-For
    bouncer-scope-stream:
      plugin:
        bouncer:
          bouncerEnabled: "true"
          lapiKey: "a1b2c3d4e5f60718293a4b5c6d7e8f90"
          lapiHost: crowdsec:8080
          httpTimeoutSeconds: "60"
          logLevel: DEBUG
          lapiUpdateIntervalSeconds: "2"
          lapiStreamStartupBlock: "false"
          lapiMode: stream
          lapiScopeHeaders:
            Country: X-IPCountry
            AS: CF-ASN
            username: X-User
          bouncerForwardedTrustedIps:
            - "172.16.0.0/12"
            - "127.0.0.1/32"
          bouncerForwardedHeader: X-Forwarded-For
    bouncer-header-none:
      plugin:
        bouncer:
          bouncerEnabled: "true"
          lapiKey: "c51a1c7000000000000000000000000c"
          lapiHost: crowdsec:8080
          httpTimeoutSeconds: "60"
          logLevel: DEBUG
          lapiMode: none
          lapiScopeHeaders:
            Country: CF-IPCountry
            AS: CF-ASN
            username: X-User
          bouncerForwardedTrustedIps:
            - "172.16.0.0/12"
            - "127.0.0.1/32"
          bouncerForwardedHeader: X-Forwarded-For
    chain-scope-none:
      chain:
        middlewares:
          - geo-enrich
          - bouncer-scope-none
    chain-scope-stream:
      chain:
        middlewares:
          - geo-enrich
          - bouncer-scope-stream
