<!DOCTYPE html>
<html lang="en">

<head>
  <title>{{ .Domain }}</title>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    html,
    body {
      height: 100%;
      margin: 0;
      background: #fff;
      color: #1c1c1c;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      display: flex;
      align-items: center;
      justify-content: center;
    }

    main {
      width: min(420px, calc(100% - 48px));
    }

    .brand {
      font-size: 22px;
      font-weight: 650;
      letter-spacing: -0.03em;
    }

    h1 {
      margin: 16px 0 22px;
      font-size: 16px;
      font-weight: 400;
      line-height: 1.4;
    }

    .note {
      margin: 28px 0 0;
      color: #666;
      font-size: 14px;
      line-height: 1.5;
    }

    .trace {
      margin: 18px 0 0;
      color: #8a8a8a;
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 12px;
      line-height: 1.4;
      word-break: break-all;
    }
  </style>
</head>

<body>
  <main>
    <div class="brand">{{ .Domain }}</div>
    <h1>Access denied</h1>
    <p class="note"><em>{{ .Domain }}</em> has blocked this connection.</p>
    {{ if .TraceID }}
    <p class="trace">{{ .TraceID }}</p>
    {{ end }}
  </main>
</body>

</html>
